version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract-backend
    restart: always
    expose:
      - "8000"
    volumes:
      - backend-data:/app/data
      - backend-storage:/app/storage
      - backend-secure:/app/secure
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=sqlite:////app/data/contracts.db
      - STORAGE_PATH=/app/storage
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: contract-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend-data:
  backend-storage:
  backend-secure:
